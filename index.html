<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국형 사회정서교육 교육과정</title>
</head>
<body>
<style>
  :root{
    --bg:#e9ebee;
    --paper:#ffffff;
    --ink:#222;
    --muted:#6b7280;
    --accent:#3a5ba0;
    --shadow:rgba(0,0,0,.35);
    --panel:#ffffff;
    --panel-border:#d8dade;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171c;
      --paper:#1f2128;
      --ink:#e7e8ea;
      --muted:#9aa0aa;
      --accent:#8fb0ff;
      --shadow:rgba(0,0,0,.6);
      --panel:#1c1e24;
      --panel-border:#33363f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171c;
    --paper:#1f2128;
    --ink:#e7e8ea;
    --muted:#9aa0aa;
    --accent:#8fb0ff;
    --shadow:rgba(0,0,0,.6);
    --panel:#1c1e24;
    --panel-border:#33363f;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Roboto,sans-serif;
    overflow-x:hidden;
  }

  .app{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:16px;
    padding-block:20px;
    gap:14px;
  }

  header{
    width:100%;
    max-width:900px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  header h1{
    font-size:16px;
    margin:0;
    font-weight:700;
    color:var(--ink);
  }
  header .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .head-left{min-width:0;}

  .icon-btn{
    border:1px solid var(--panel-border);
    background:var(--panel);
    color:var(--ink);
    border-radius:8px;
    width:36px;
    height:36px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
    line-height:1;
  }
  .icon-btn:hover{border-color:var(--accent);}

  .stage-wrap{
    position:relative;
    width:100%;
    max-width:920px;
    display:flex;
    justify-content:center;
    perspective:3200px;
    touch-action: none;
    overflow:hidden;
  }

  .zoom-stage{
    width:100%;
    max-width:820px;
    transform-origin:50% 50%;
    will-change:transform;
  }
  .zoom-stage.zoomed{cursor:grab;}
  .zoom-stage.zoomed.dragging{cursor:grabbing;}

  .book{
    position:relative;
    width:100%;
    aspect-ratio: 1024 / 724;
    box-shadow:0 20px 50px var(--shadow);
    border-radius:4px;
    background:var(--paper);
  }

  .page{
    position:absolute;
    inset:0;
    background:var(--paper);
    border-radius:4px;
    overflow:hidden;
    backface-visibility:hidden;
    transform-style:preserve-3d;
  }
  .page img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    image-rendering:auto;
  }

  /* stacked pages beneath, for the "book" thickness look */
  .stack{
    position:absolute;
    inset:0;
    border-radius:4px;
    background:var(--paper);
    box-shadow:0 0 0 1px var(--panel-border) inset;
  }

  .flipper{
    position:absolute;
    inset:0;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition: transform .55s cubic-bezier(.4,.1,.3,1);
    z-index:5;
  }
  .flipper.flip-back{
    transform-origin:right center;
  }
  .flipper .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:4px;
    overflow:hidden;
  }
  .flipper .front{transform:rotateY(0deg);}
  .flipper .back{transform:rotateY(180deg);}
  .flipper .face img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none;background:var(--paper);image-rendering:auto;}
  .flipper .shade{
    position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,.25), rgba(0,0,0,0) 40%);
    opacity:0;
    transition:opacity .55s;
    pointer-events:none;
  }
  .flipper.active .shade{opacity:1;}

  .edge-tap{
    position:absolute;
    top:0;bottom:0;
    width:18%;
    z-index:6;
    cursor:pointer;
    background:transparent;
  }
  .edge-tap.left{left:0;}
  .edge-tap.right{right:0;}

  .controls{
    width:100%;
    max-width:900px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .nav-btn{
    border:1px solid var(--panel-border);
    background:var(--panel);
    color:var(--ink);
    border-radius:999px;
    padding:8px 16px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .nav-btn:disabled{opacity:.35;cursor:default;}
  .nav-btn:not(:disabled):hover{border-color:var(--accent);}

  .page-indicator{
    font-size:13px;
    color:var(--muted);
    min-width:64px;
    text-align:center;
  }

  .progress{
    width:100%;
    max-width:820px;
    height:4px;
    background:var(--panel-border);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background:var(--accent);
    transition:width .3s;
  }

  .thumbs{
    width:100%;
    max-width:900px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-block: 4px 8px;
    scrollbar-width:thin;
  }
  .thumb{
    flex:0 0 auto;
    width:64px;
    aspect-ratio:1024/724;
    border-radius:3px;
    overflow:hidden;
    border:2px solid transparent;
    cursor:pointer;
    opacity:.6;
    background:var(--paper);
  }
  .thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .thumb.active{border-color:var(--accent);opacity:1;}
  .thumb:hover{opacity:1;}

  .hint{
    font-size:11px;
    color:var(--muted);
    text-align:center;
  }

  .zoom-controls{
    position:absolute;
    right:8px;
    bottom:8px;
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:6px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:5px;
    box-shadow:0 6px 18px var(--shadow);
  }
  .zoom-controls button{
    border:none;
    background:transparent;
    color:var(--ink);
    width:32px;
    height:32px;
    border-radius:7px;
    font-size:17px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .zoom-controls button:hover{background:var(--bg);}
  .zoom-controls button:disabled{opacity:.3;cursor:default;}
  .zoom-level{
    font-size:10px;
    color:var(--muted);
    text-align:center;
  }

  /* fullscreen mode */
  .app.fs{
    background:var(--bg);
  }

  @media (max-width:700px){
    .book{max-width:94vw;}
    header h1{font-size:14px;}
  }
</style>

<div class="app" id="app">
  <header>
    <div class="head-left">
      <h1>한국형 사회정서교육 교육과정</h1>
      <div class="sub">2025 TR-27 · 교육부</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" id="themeBtn" title="테마 전환">🌓</button>
      <button class="icon-btn" id="fsBtn" title="전체화면">⛶</button>
    </div>
  </header>

  <div class="stage-wrap" id="stageWrap">
    <div class="zoom-stage" id="zoomStage">
      <div class="book" id="book">
        <!-- built by JS -->
      </div>
    </div>
    <div class="zoom-controls">
      <button id="zoomInBtn" title="확대">＋</button>
      <div class="zoom-level" id="zoomLevel">100%</div>
      <button id="zoomOutBtn" title="축소">－</button>
      <button id="zoomResetBtn" title="원래 크기로">⤾</button>
    </div>
  </div>

  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <div class="controls">
    <button class="nav-btn" id="firstBtn" title="처음으로">⏮</button>
    <button class="nav-btn" id="prevBtn">◀ 이전</button>
    <span class="page-indicator" id="pageIndicator">1 / 22</span>
    <button class="nav-btn" id="nextBtn">다음 ▶</button>
    <button class="nav-btn" id="lastBtn" title="마지막으로">⏭</button>
  </div>

  <div class="thumbs" id="thumbs"></div>
  <div class="hint">페이지 모서리를 클릭하거나 ← → 키, 스와이프로 넘겨보세요 · 확대 버튼/더블클릭/핀치로 글씨를 크게 볼 수 있어요</div>
</div>

<script>
(function(){
  var TOTAL = 22;
  var pages = [];
  for(var i=1;i<=TOTAL;i++){
    pages.push('pages/page-' + String(i).padStart(2,'0') + '.jpg');
  }

  var current = 0; // 0-indexed, current visible page
  var animating = false;

  var book = document.getElementById('book');
  var thumbsEl = document.getElementById('thumbs');
  var pageIndicator = document.getElementById('pageIndicator');
  var progressBar = document.getElementById('progressBar');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var firstBtn = document.getElementById('firstBtn');
  var lastBtn = document.getElementById('lastBtn');
  var themeBtn = document.getElementById('themeBtn');
  var fsBtn = document.getElementById('fsBtn');
  var appEl = document.getElementById('app');
  var stageWrap = document.getElementById('stageWrap');
  var zoomStage = document.getElementById('zoomStage');
  var zoomInBtn = document.getElementById('zoomInBtn');
  var zoomOutBtn = document.getElementById('zoomOutBtn');
  var zoomResetBtn = document.getElementById('zoomResetBtn');
  var zoomLevel = document.getElementById('zoomLevel');

  var MIN_ZOOM = 1, MAX_ZOOM = 2.2;
  var zoom = 1, panX = 0, panY = 0;

  function clampPan(){
    var rect = stageWrap.getBoundingClientRect();
    var contentW = rect.width * zoom;
    var contentH = rect.height * zoom;
    var maxX = Math.max(0, (contentW - rect.width) / 2);
    var maxY = Math.max(0, (contentH - rect.height) / 2);
    panX = Math.min(maxX, Math.max(-maxX, panX));
    panY = Math.min(maxY, Math.max(-maxY, panY));
  }

  function applyZoom(){
    clampPan();
    zoomStage.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    zoomLevel.textContent = Math.round(zoom*100) + '%';
    zoomStage.classList.toggle('zoomed', zoom>1);
    zoomOutBtn.disabled = zoom<=MIN_ZOOM;
    zoomInBtn.disabled = zoom>=MAX_ZOOM;
    // when zoomed in, hand navigation over to buttons/keys so drag can pan
    var edges = book.querySelectorAll('.edge-tap');
    edges.forEach(function(e){ e.style.pointerEvents = zoom>1 ? 'none' : 'auto'; });
  }

  function setZoom(z, cx, cy){
    var newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
    if(cx!==undefined){
      var rect = stageWrap.getBoundingClientRect();
      var ox = cx - rect.left - rect.width/2;
      var oy = cy - rect.top - rect.height/2;
      var scaleDelta = newZoom/zoom;
      panX = ox - (ox - panX) * scaleDelta;
      panY = oy - (oy - panY) * scaleDelta;
    }
    zoom = newZoom;
    if(zoom===MIN_ZOOM){ panX = 0; panY = 0; }
    applyZoom();
  }

  zoomInBtn.addEventListener('click', function(){ setZoom(zoom + 0.3); });
  zoomOutBtn.addEventListener('click', function(){ setZoom(zoom - 0.3); });
  zoomResetBtn.addEventListener('click', function(){ setZoom(1); });

  stageWrap.addEventListener('dblclick', function(e){
    if(zoom>1){ setZoom(1); }
    else { setZoom(1.8, e.clientX, e.clientY); }
  });

  stageWrap.addEventListener('wheel', function(e){
    if(!e.ctrlKey && Math.abs(e.deltaY) < 2) return;
    e.preventDefault();
    var delta = -e.deltaY * 0.01;
    setZoom(zoom + delta, e.clientX, e.clientY);
  }, {passive:false});

  // mouse drag panning when zoomed
  var dragging = false, dragStartX=0, dragStartY=0, panStartX=0, panStartY=0;
  stageWrap.addEventListener('mousedown', function(e){
    if(zoom<=1) return;
    dragging = true;
    zoomStage.classList.add('dragging');
    dragStartX = e.clientX; dragStartY = e.clientY;
    panStartX = panX; panStartY = panY;
    e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if(!dragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    applyZoom();
  });
  window.addEventListener('mouseup', function(){
    dragging = false;
    zoomStage.classList.remove('dragging');
  });

  // touch: pinch to zoom + drag to pan when zoomed, else swipe handled below
  var pinchStartDist = null, pinchStartZoom = 1;
  var touchPanStartX=0, touchPanStartY=0, touchStartPanX=0, touchStartPanY=0;
  function touchDist(t){
    var dx = t[0].clientX - t[1].clientX;
    var dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }
  stageWrap.addEventListener('touchstart', function(e){
    if(e.touches.length===2){
      pinchStartDist = touchDist(e.touches);
      pinchStartZoom = zoom;
    } else if(e.touches.length===1 && zoom>1){
      touchPanStartX = e.touches[0].clientX;
      touchPanStartY = e.touches[0].clientY;
      touchStartPanX = panX;
      touchStartPanY = panY;
    }
  }, {passive:true});
  stageWrap.addEventListener('touchmove', function(e){
    if(e.touches.length===2 && pinchStartDist){
      var dist = touchDist(e.touches);
      var cx = (e.touches[0].clientX + e.touches[1].clientX)/2;
      var cy = (e.touches[0].clientY + e.touches[1].clientY)/2;
      setZoom(pinchStartZoom * (dist/pinchStartDist), cx, cy);
      e.preventDefault();
    } else if(e.touches.length===1 && zoom>1){
      panX = touchStartPanX + (e.touches[0].clientX - touchPanStartX);
      panY = touchStartPanY + (e.touches[0].clientY - touchPanStartY);
      applyZoom();
      e.preventDefault();
    }
  }, {passive:false});
  stageWrap.addEventListener('touchend', function(e){
    if(e.touches.length<2) pinchStartDist = null;
  });

  function buildBook(){
    book.innerHTML = '';

    // base stack (bottom page = current page's flat image, for depth illusion)
    var stack = document.createElement('div');
    stack.className = 'stack';
    book.appendChild(stack);

    var baseImg = document.createElement('img');
    baseImg.style.width='100%';
    baseImg.style.height='100%';
    baseImg.style.objectFit='contain';
    baseImg.style.borderRadius='4px';
    baseImg.src = pages[current];
    stack.appendChild(baseImg);

    var leftTap = document.createElement('div');
    leftTap.className = 'edge-tap left';
    leftTap.addEventListener('click', function(){ goTo(current-1); });
    book.appendChild(leftTap);

    var rightTap = document.createElement('div');
    rightTap.className = 'edge-tap right';
    rightTap.addEventListener('click', function(){ goTo(current+1); });
    book.appendChild(rightTap);

    updateUI();
  }

  function updateUI(){
    pageIndicator.textContent = (current+1) + ' / ' + TOTAL;
    progressBar.style.width = (((current+1)/TOTAL)*100) + '%';
    prevBtn.disabled = current<=0;
    firstBtn.disabled = current<=0;
    nextBtn.disabled = current>=TOTAL-1;
    lastBtn.disabled = current>=TOTAL-1;

    var thumbs = thumbsEl.querySelectorAll('.thumb');
    thumbs.forEach(function(t,idx){
      t.classList.toggle('active', idx===current);
    });
    var activeThumb = thumbsEl.children[current];
    if(activeThumb){
      activeThumb.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    }
  }

  function goTo(target){
    if(animating) return;
    if(target<0 || target>=TOTAL) return;
    if(target===current) return;
    if(zoom>1) setZoom(1);

    var forward = target>current;
    animating = true;

    var flipper = document.createElement('div');
    flipper.className = 'flipper' + (forward ? '' : ' flip-back');

    var frontFace = document.createElement('div');
    frontFace.className = 'face front';
    var frontImg = document.createElement('img');
    frontImg.src = forward ? pages[current] : pages[current];
    frontFace.appendChild(frontImg);

    var backFace = document.createElement('div');
    backFace.className = 'face back';
    var backImg = document.createElement('img');
    backImg.src = forward ? pages[target] : pages[target];
    backFace.appendChild(backImg);

    var shade = document.createElement('div');
    shade.className = 'shade';

    flipper.appendChild(frontFace);
    flipper.appendChild(backFace);
    flipper.appendChild(shade);
    book.appendChild(flipper);

    // set base stack to target image ahead of time (revealed as flip completes)
    var stackImg = book.querySelector('.stack img');
    if(stackImg) stackImg.src = pages[target];

    requestAnimationFrame(function(){
      flipper.classList.add('active');
      flipper.style.transform = forward ? 'rotateY(-180deg)' : 'rotateY(180deg)';
    });

    setTimeout(function(){
      current = target;
      animating = false;
      buildBook();
    }, 560);
  }

  function buildThumbs(){
    thumbsEl.innerHTML = '';
    pages.forEach(function(src, idx){
      var t = document.createElement('div');
      t.className = 'thumb';
      var img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      t.appendChild(img);
      t.addEventListener('click', function(){ goTo(idx); });
      thumbsEl.appendChild(t);
    });
  }

  prevBtn.addEventListener('click', function(){ goTo(current-1); });
  nextBtn.addEventListener('click', function(){ goTo(current+1); });
  firstBtn.addEventListener('click', function(){ goTo(0); });
  lastBtn.addEventListener('click', function(){ goTo(TOTAL-1); });

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight') goTo(current+1);
    if(e.key==='ArrowLeft') goTo(current-1);
  });

  // swipe support (only when not zoomed in, so pinch/pan takes priority otherwise)
  var touchStartX = null;
  book.addEventListener('touchstart', function(e){
    if(zoom>1 || e.touches.length!==1) { touchStartX = null; return; }
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  book.addEventListener('touchend', function(e){
    if(touchStartX===null || zoom>1) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx<0) goTo(current+1); else goTo(current-1);
    }
    touchStartX = null;
  });

  themeBtn.addEventListener('click', function(){
    var root = document.documentElement;
    var cur = root.getAttribute('data-theme');
    if(cur==='dark'){ root.setAttribute('data-theme','light'); }
    else if(cur==='light'){ root.removeAttribute('data-theme'); }
    else { root.setAttribute('data-theme','dark'); }
  });

  fsBtn.addEventListener('click', function(){
    if(!document.fullscreenElement){
      (appEl.requestFullscreen || appEl.webkitRequestFullscreen || function(){}).call(appEl);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  });

  buildThumbs();
  buildBook();
  applyZoom();

  // preload all pages
  pages.forEach(function(src){ var im = new Image(); im.src = src; });
})();
</script>

</body>
</html>
